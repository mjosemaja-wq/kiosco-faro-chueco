<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiosco del Faro Chueco</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCF5;--sf:#fff;--tx:#1B2B30;--mu:#4a5f66;--pr:#14505C;--pt:#FFFCF5;--ac:#F2B632;--at:#1B2B30;--sa:#EBDDBF;--ok:#58A4A6;--no:#D2513F;--bd:#d8cbad;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B2B30;--sf:#243b42;--tx:#FFFCF5;--mu:#b9c8ca;--pr:#58A4A6;--pt:#1B2B30;--sa:#2e4850;--bd:#3a555d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B2B30;--sf:#243b42;--tx:#FFFCF5;--mu:#b9c8ca;--pr:#58A4A6;--pt:#1B2B30;--sa:#2e4850;--bd:#3a555d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3,.btn,.tab{font-family:Rubik,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:20px;margin:18px 0 8px}h3{font-size:18px;margin:0}
p{margin:0}.mu{color:var(--mu)}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{min-height:56px;border:0;border-radius:14px;padding:0 16px;font-weight:700;font-size:17px;background:var(--pr);color:var(--pt);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.go{background:var(--ac);color:var(--at);flex:2;font-size:20px}
.btn.gh{background:transparent;color:var(--tx);border:2px solid var(--bd);flex:1;font-size:15px}
.btn.rd{background:var(--no);color:#fff}
.btn.sm{min-height:44px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.b{border-radius:99px;padding:3px 12px;font:700 14px Rubik,sans-serif;white-space:nowrap}
.b.d{background:var(--ok);color:#1B2B30}.b.r{background:var(--ac);color:#1B2B30}.b.a{background:var(--no);color:#fff}.b.h{background:var(--sa);color:var(--tx)}
.stock{font:700 34px/1 Rubik,sans-serif}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:2px solid var(--bd);background:transparent;color:var(--tx);font:700 15px Rubik,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pr);color:var(--pt);border-color:var(--pr)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--pr);padding:0 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{flex:1;min-height:60px;background:none;border:0;color:var(--pt);font-size:16px;font-weight:500;opacity:.75;cursor:pointer}
.tab[aria-current="page"]{opacity:1;font-weight:700;border-bottom:4px solid var(--ac)}
label{display:block;font-weight:700;margin:12px 0 4px}
input,select{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 12px;font:inherit}
input[type=checkbox]{width:26px;min-height:26px;accent-color:var(--pr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--no);font-weight:700;margin-top:10px}
.empty{text-align:center;padding:28px 12px;border:2px dashed var(--bd);border-radius:16px;margin:14px 0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:700;z-index:9;display:none;max-width:536px;margin:0 auto}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
#modal .card{max-width:420px;width:100%}
.mono-list{white-space:pre-wrap;background:var(--sa);border-radius:12px;padding:10px;font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<script>
/* Clave del panel: se cambia acá (ver README). */
const PANEL_KEY = "faro2026";
const KEY = "faro-chueco-kiosco-v1";
const CATS = ["Bebidas","Almacén","Viaje","Alquiler"];
const SEED = [
["Agua mineral 500 ml","Bebidas",60,18,6,24],["Cerveza en lata 473 ml","Bebidas",120,3,6,30],
["Refresco de pomelo 500 ml","Bebidas",90,10,4,16],["Yerba 500 g","Almacén",180,0,2,6],
["Alfajor de dulce de leche","Almacén",55,14,5,20],["Fideos 500 g","Almacén",95,4,4,10],
["Protector solar FPS 50","Viaje",590,2,3,8],["Candado para locker","Viaje",350,7,3,10],
["Adaptador de enchufe","Viaje",290,0,2,5],["Postal del faro","Viaje",70,25,5,30],
["Toalla de alquiler, por estadía","Alquiler",150,12,4,20],["Sombrilla de alquiler, por día","Alquiler",220,5,2,6]
].map((r,i)=>({id:"p"+(i+1),nombre:r[0],categoria:r[1],precio:r[2],stock:r[3],minimo:r[4],ideal:r[5],visible:true}));
const seed = () => JSON.parse(JSON.stringify(SEED));

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw === null){ const s = seed(); try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){} return s; }
    const a = JSON.parse(raw);
    if(Array.isArray(a)) return a;
  }catch(e){}
  return seed();
}
function save(items){ try{ localStorage.setItem(KEY,JSON.stringify(items)); return true; }catch(e){ return false; } }

const S = {items:load(), tab:"mostrador", cat:"Todas", ok:false, edit:null};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "$ " + Number(n).toLocaleString("es-UY");
const status = p => p.stock<=0 ? "Agotado" : p.stock<=p.minimo ? "Reponer" : "Disponible";
const sug = p => Math.max(0, p.ideal - p.stock);
const badge = p => { const s=status(p); return `<span class="b ${s==="Agotado"?"a":s==="Reponer"?"r":"d"}">${s}</span>`; };
const toRestock = () => S.items.filter(p=>p.stock<=p.minimo).sort((a,b)=>(a.stock>0)-(b.stock>0)||a.nombre.localeCompare(b.nombre));

let tt;
function flash(msg,bad){ const t=document.getElementById("toast"); t.textContent=msg; t.style.background=bad?"var(--no)":""; t.style.color=bad?"#fff":""; t.style.display="block"; clearTimeout(tt); tt=setTimeout(()=>t.style.display="none",2600); }
function commit(items,msg){
  if(!save(items)){ flash("No se pudo guardar en este navegador. No se cambió nada.",true); return false; }
  S.items=items; render(); flash(msg); return true;
}
function ask(msg,yes,label){
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="card"><p>${esc(msg)}</p><div class="acts"><button class="btn gh" data-a="no">Cancelar</button><button class="btn rd" style="flex:1" data-a="yes">${label||"Confirmar"}</button></div></div>`;
  m.style.display="flex"; m._yes=yes;
}

function lock(){
  return `<form data-f="lock" class="card"><h2 style="margin-top:0">Entrá con la clave</h2><p class="mu">Esta pantalla es para quien maneja el stock y las compras.</p>
  <label for="k">Clave</label><input id="k" type="password" autocomplete="off" required><p class="err" id="e" hidden>Clave incorrecta.</p>
  <div class="acts"><button class="btn go" type="submit">Entrar</button></div></form>`;
}

function vMostrador(){
  const list=S.items.filter(p=>p.visible&&(S.cat==="Todas"||p.categoria===S.cat));
  const chips=["Todas",...CATS].map(c=>`<button class="chip" data-a="cat" data-v="${c}" aria-pressed="${S.cat===c}">${c}</button>`).join("");
  const cards=list.map(p=>`<article class="card"><div class="row"><div><h3>${esc(p.nombre)}</h3><p class="mu">${p.categoria}, ${money(p.precio)}</p></div>${badge(p)}</div>
  <div class="row" style="align-items:center;margin-top:10px"><p><span class="stock">${p.stock}</span> en stock</p></div>
  <div class="acts"><button class="btn go" data-a="sell" data-id="${p.id}" ${p.stock<=0?"disabled":""}>Vendí 1</button>
  <button class="btn gh" data-a="ret" data-id="${p.id}" ${p.stock>=p.ideal+10?"disabled":""}>Devolvieron 1</button></div></article>`).join("");
  const empty=`<div class="empty"><p><strong>No hay productos para mostrar.</strong></p><p class="mu">Cargá uno o marcalo como visible en la pantalla Productos.</p></div>`;
  return `<h1>Mostrador</h1><p class="mu">Tocá «Vendí 1» y el stock baja al instante.</p><div class="chips">${chips}</div>${cards||empty}`;
}

function vPanel(){
  if(!S.ok) return `<h1>Panel de compras</h1>`+lock();
  const l=toRestock();
  const txt="Reposición Faro Chueco\n"+l.map(p=>`• ${p.nombre}: ${sug(p)}`).join("\n");
  const rows=l.map(p=>`<div class="card"><div class="row"><div><h3>${esc(p.nombre)}</h3><p class="mu">Quedan ${p.stock}, ideal ${p.ideal}</p></div>${badge(p)}</div><p style="margin-top:8px"><strong>Comprar ${sug(p)}</strong></p></div>`).join("");
  const empty=`<div class="empty"><p><strong>Todo en orden.</strong></p><p class="mu">Ningún producto está en el mínimo o por debajo.</p></div>`;
  return `<h1>Panel de compras</h1><p class="mu">Recepción de 8:00 a 23:00. Compras lunes y jueves a la mañana.</p>
  ${l.length?`<div class="acts"><a class="btn go" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Compartir por WhatsApp</a></div>
  <div class="acts"><button class="btn gh" data-a="all">Reponer todo</button></div><h2>Para comprar (${l.length})</h2>${rows}<h2>Mensaje</h2><div class="mono-list">${esc(txt)}</div>`:empty}
  <h2>Más opciones</h2><div class="acts"><button class="btn gh" data-a="reset">Restaurar datos de ejemplo</button><button class="btn gh" data-a="out">Cerrar panel</button></div>`;
}

function vProductos(){
  if(!S.ok) return `<h1>Productos</h1>`+lock();
  if(S.edit) return vForm(S.edit==="new"?{nombre:"",categoria:"Bebidas",precio:"",stock:"",minimo:"",ideal:"",visible:true}:S.items.find(p=>p.id===S.edit));
  const rows=S.items.map(p=>`<div class="card"><div class="row"><div><h3>${esc(p.nombre)}</h3><p class="mu">${p.categoria}, ${money(p.precio)}, stock ${p.stock}, mínimo ${p.minimo}, ideal ${p.ideal}</p></div><div style="display:grid;gap:6px;justify-items:end">${badge(p)}${p.visible?"":'<span class="b h">Oculto</span>'}</div></div>
  <div class="acts"><button class="btn sm gh" data-a="edit" data-id="${p.id}">Editar</button><button class="btn sm gh" data-a="del" data-id="${p.id}">Borrar</button></div></div>`).join("");
  const empty=`<div class="empty"><p><strong>Todavía no hay productos.</strong></p><p class="mu">Tocá «Nuevo producto» para cargar el primero.</p></div>`;
  return `<h1>Productos</h1><div class="acts"><button class="btn go" data-a="new">Nuevo producto</button></div>${rows||empty}`;
}
function vForm(p){
  const n=(id,l,v)=>`<div><label for="${id}">${l}</label><input id="${id}" name="${id}" type="number" min="0" step="1" inputmode="numeric" value="${v}" required></div>`;
  return `<h1>${S.edit==="new"?"Nuevo producto":"Editar producto"}</h1><form data-f="prod" class="card">
  <label for="nombre">Nombre</label><input id="nombre" name="nombre" value="${esc(p.nombre)}" required>
  <label for="categoria">Categoría</label><select id="categoria" name="categoria">${CATS.map(c=>`<option${c===p.categoria?" selected":""}>${c}</option>`).join("")}</select>
  <div class="g2">${n("precio","Precio ($)",p.precio)}${n("stock","Stock",p.stock)}${n("minimo","Stock mínimo",p.minimo)}${n("ideal","Cantidad ideal",p.ideal)}</div>
  <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" name="visible" ${p.visible?"checked":""}> Visible en el mostrador</label>
  <p class="err" id="e" hidden></p><div class="acts"><button class="btn gh" type="button" data-a="cancel">Cancelar</button><button class="btn go" type="submit">Guardar</button></div></form>`;
}

function render(){
  const n=toRestock().length, T=[["mostrador","Mostrador"],["panel","Panel"+(n?` (${n})`:"")],["productos","Productos"]];
  document.getElementById("app").innerHTML=(S.tab==="mostrador"?vMostrador():S.tab==="panel"?vPanel():vProductos())+
  `<nav aria-label="Pantallas">${T.map(t=>`<button class="tab" data-a="tab" data-v="${t[0]}" ${S.tab===t[0]?'aria-current="page"':""}>${t[1]}</button>`).join("")}</nav>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.disabled) return;
  const a=b.dataset.a, id=b.dataset.id, p=S.items.find(x=>x.id===id), m=document.getElementById("modal");
  if(a==="tab"){S.tab=b.dataset.v;S.edit=null;render();}
  else if(a==="cat"){S.cat=b.dataset.v;render();}
  else if(a==="sell"&&p&&p.stock>0) commit(S.items.map(x=>x.id===id?{...x,stock:x.stock-1}:x),"Vendido: "+p.nombre);
  else if(a==="ret"&&p&&p.stock<p.ideal+10) commit(S.items.map(x=>x.id===id?{...x,stock:x.stock+1}:x),"Devuelto: "+p.nombre);
  else if(a==="all") ask("¿Llevar cada producto de la lista a su cantidad ideal?",()=>{const ids=toRestock().map(x=>x.id);commit(S.items.map(x=>ids.includes(x.id)?{...x,stock:x.ideal}:x),"Stock repuesto");},"Reponer todo");
  else if(a==="reset") ask("Esto borra tus cambios y vuelve a los 12 productos de ejemplo de este kiosco. ¿Seguimos?",()=>commit(seed(),"Datos de ejemplo restaurados"),"Restaurar");
  else if(a==="out"){S.ok=false;render();}
  else if(a==="new"){S.edit="new";render();}
  else if(a==="edit"){S.edit=id;render();}
  else if(a==="cancel"){S.edit=null;render();}
  else if(a==="del"&&p) ask(`¿Borrar «${p.nombre}»? Sale del mostrador y del panel.`,()=>commit(S.items.filter(x=>x.id!==id),"Producto borrado"),"Borrar");
  else if(a==="no") m.style.display="none";
  else if(a==="yes"){m.style.display="none";m._yes&&m._yes();}
});

document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target, d=f.dataset.f, er=f.querySelector("#e");
  if(d==="lock"){ if(f.k.value===PANEL_KEY){S.ok=true;render();} else {er.hidden=false;} return; }
  const v=f.elements, num=k=>Number(v[k].value), nombre=v.nombre.value.trim();
  const dup=S.items.some(x=>x.id!==S.edit&&x.nombre.trim().toLowerCase()===nombre.toLowerCase());
  const bad=m=>{er.textContent=m;er.hidden=false;};
  if(!nombre) return bad("Poné un nombre.");
  if(dup) return bad("Ya hay un producto con ese nombre.");
  if(["precio","stock","minimo","ideal"].some(k=>!Number.isInteger(num(k))||num(k)<0)) return bad("Precio, stock, mínimo e ideal son números enteros desde 0.");
  if(num("ideal")<=num("minimo")) return bad("La cantidad ideal tiene que ser mayor que el stock mínimo.");
  const item={id:S.edit==="new"?"p"+Date.now():S.edit,nombre,categoria:v.categoria.value,precio:num("precio"),stock:num("stock"),minimo:num("minimo"),ideal:num("ideal"),visible:v.visible.checked};
  const items=S.edit==="new"?[...S.items,item]:S.items.map(x=>x.id===S.edit?item:x);
  const was=S.edit; if(save(items)){S.items=items;S.edit=null;render();flash(was==="new"?"Producto agregado":"Cambios guardados");}
  else bad("No se pudo guardar en este navegador. Lo que escribiste sigue acá.");
});
render();
</script>
</body>
</html>
